spring.application.name=transactions-service

# In-memory H2; data is lost on restart (acceptable per assessment scope).
# LOCK_TIMEOUT bounds how long a duplicate POST blocks waiting for the first one to commit.
# After that the caller gets 503 + Retry-After and nothing is created.
spring.datasource.url=jdbc:h2:mem:transactions;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=5000
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

transactions.idempotency.retention=PT24H
transactions.idempotency.purge-interval=PT1H
